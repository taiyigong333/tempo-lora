# 沿用OpenPI现场配置的硬件保护与低速关节归位约定。
safety:
  speed_percent: 90
  feedback_max_age_s: 0.1
  gripper_feedback_tolerance_m: 0.001
  gripper_range_m: [0, 0.10]
  gripper_force_n: 1.0
  workspace_m: [[-0.02, 1], [-1, 1], [0, 1]]
  max_position_step_m: 0.3
  max_rotation_step_rad: 0.5
  action_max_age_s: 0.5
  watchdog_s: 0.5
  max_control_lag_s: 0.10
  control_ready_timeout_s: 2
  control_ready_poll_s: 0.02
  enable_timeout_s: 5
  feedback_wait_timeout_s: 5
  firmware_query_timeout_s: 1
home:
  joint_positions_rad: [0.0111352006, 0.8443379322, -1.0155198253, 1.1606788592, 0.0746477321, 0.0196698607]
  joint_limits_rad: [[-2.617994, 2.617994], [0, 3.141593], [-2.96706, 0], [-1.553344, 1.553344], [-1.553344, 1.553344], [-3.141593, 3.141593]]
  speed_percent: 10
  initial_joint_tolerance_rad: 0.035
  joint_tolerance_rad: 0.035
  max_joint_delta_rad: 1.7
  start_workspace_m: [[-0.02, 1], [-1, 1], [0, 1]]
  max_distance_m: 1
  max_rotation_rad: 2
  timeout_s: 30
